<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AktivHelse – Medlemsportal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-innhold">
      <div class="brand-rad">
        <span class="brand-ikon">AH</span>
        <div>
          <h1>AktivHelse Treningssenter</h1>
          <p class="undertittel">Medlemsportal • Sentrum, Vest &amp; Nord</p>
        </div>
      </div>
      <div class="rolle-bytte">
        <span class="aktiv-rolle">Medlem</span>
        <a href="ansatt.html" class="btn-sekundar">Ansattvisning</a>
        <a href="index.html" class="btn-lenke">Startside</a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Medlemskort / Hurtigbooking -->
    <section class="kort" style="margin-bottom: 24px; border-left: 4px solid var(--salvie);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
        <div>
          <h2 style="font-size: 16px; color: var(--mork-skifer);">Medlemskort / Hurtigbooking</h2>
          <p class="meta">Hvem trener i dag? Legg inn medlemsnummeret ditt én gang, så booker du med ett klikk.</p>
        </div>
        <span id="profil-status" class="badge badge-ledig" style="display: none;">Aktivt medlemskort</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
        <input type="text" id="aktiv-medlemsnr" placeholder="Medlemsnummer (f.eks. 1010)" oninput="lagreAktivBruker()" />
        <input type="text" id="aktiv-navn" placeholder="Fullt navn" oninput="lagreAktivBruker()" />
        <input type="email" id="aktiv-epost" placeholder="E-postadresse" oninput="lagreAktivBruker()" />
      </div>
    </section>

    <!-- Avdelings-chips (hurtigfilter) -->
    <section class="filter-bar">
      <div>
        <h2>Ukens gruppetimer</h2>
        <p class="meta">Velg senter for å filtrere timeplanen.</p>
      </div>
      <div class="chip-gruppe" role="group" aria-label="Velg avdeling">
        <button type="button" class="chip aktiv" data-avdeling="Alle" onclick="velgAvdelingChip('Alle', this)">Alle sentre</button>
        <button type="button" class="chip" data-avdeling="Sentrum" onclick="velgAvdelingChip('Sentrum', this)">Sentrum</button>
        <button type="button" class="chip" data-avdeling="Vest" onclick="velgAvdelingChip('Vest', this)">Vest</button>
        <button type="button" class="chip" data-avdeling="Nord" onclick="velgAvdelingChip('Nord', this)">Nord</button>
        <input type="hidden" id="avdeling-filter" value="Alle" />
      </div>
    </section>

    <div id="status-melding" class="melding skjult" role="status"></div>
    <section id="timeplan-liste" class="timeplan-grid"></section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/medlem.js"></script>
</body>
</html>
