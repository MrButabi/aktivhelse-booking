<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AktivHelse – Resepsjon &amp; Ansatt</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-innhold">
      <div class="brand-rad">
        <span class="brand-ikon">AH</span>
        <div>
          <h1>AktivHelse Treningssenter</h1>
          <p class="undertittel">Resepsjon &amp; Administrasjon</p>
        </div>
      </div>
      <div class="rolle-bytte">
        <span class="aktiv-rolle">Ansatt / Admin</span>
        <a href="medlem.html" class="btn-sekundar">Medlemsvisning</a>
        <a href="index.html" class="btn-lenke">Startside</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="filter-bar">
      <div>
        <h2>Kapasitet og deltakerlister</h2>
        <p class="meta">Sanntidsoversikt på tvers av Sentrum, Vest og Nord.</p>
      </div>
      <div class="filter-kontroll">
        <div class="chip-gruppe" role="group" aria-label="Velg avdeling">
          <button type="button" class="chip aktiv" onclick="velgAnsattChip('Alle', this)">Alle sentre</button>
          <button type="button" class="chip" onclick="velgAnsattChip('Sentrum', this)">Sentrum</button>
          <button type="button" class="chip" onclick="velgAnsattChip('Vest', this)">Vest</button>
          <button type="button" class="chip" onclick="velgAnsattChip('Nord', this)">Nord</button>
        </div>
        <input type="hidden" id="ansatt-avdeling-filter" value="Alle" />
        <button type="button" class="btn-outline" onclick="nullstillDemo()">Nullstill testdata</button>
      </div>
    </section>

    <div id="status-melding" class="melding skjult" role="status"></div>
    <section id="ansatt-liste"></section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ansatt.js"></script>
</body>
</html>
