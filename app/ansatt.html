<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AktivHelse – Ansatt & Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-innhold">
      <div>
        <h1>AktivHelse Treningssenter AS</h1>
        <p class="undertittel">Ansatt / Admin – Deltakerlister og kapasitet</p>
      </div>
      <div class="rolle-bytte">
        <span class="aktiv-rolle">Rolle: <strong>Ansatt / Admin</strong></span>
        <a href="medlem.html" class="btn-sekundar">Bytt til Medlem</a>
        <a href="index.html" class="btn-lenke">Startside</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="filter-bar">
      <div>
        <h2>Kapasitets- og deltakeroversikt</h2>
        <p class="meta">Sanntidsoversikt over påmeldte medlemmer per gruppetime og avdeling.</p>
      </div>
      <div class="filter-kontroll">
        <label for="ansatt-avdeling-filter"><strong>Avdeling:</strong></label>
        <select id="ansatt-avdeling-filter" onchange="tegnAnsattOversikt()">
          <option value="Alle">Alle avdelinger (Sentrum, Vest, Nord)</option>
          <option value="Sentrum">Avd. Sentrum</option>
          <option value="Vest">Avd. Vest</option>
          <option value="Nord">Avd. Nord</option>
        </select>
        <button type="button" class="btn-sekundar" onclick="nullstillDemo()">Nullstill testdata</button>
      </div>
    </section>

    <div id="status-melding" class="melding skjult" role="status"></div>
    <section id="ansatt-liste"></section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ansatt.js"></script>
</body>
</html>
